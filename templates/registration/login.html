
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Saffron</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: #10110f; color: #f5f5f0;
      font: 16px/1.5 Inter, system-ui, sans-serif;
    }
    main { width: 100%; max-width: 420px; }
    a { color: #b7f397; text-decoration: none; }
    .brand { font-size: 22px; font-weight: 750; letter-spacing: -.8px; }
    h1 { margin: 48px 0 8px; font-size: 38px; letter-spacing: -1.8px; }
    p { color: #aaa99f; }
    label { display: block; margin: 20px 0 7px; font-size: 13px; }
    input {
      width: 100%; padding: 14px; border: 1px solid #393a35;
      border-radius: 10px; background: #191a17; color: #fff; font: inherit;
    }
    button {
      width: 100%; margin-top: 24px; padding: 14px; border: 0;
      border-radius: 999px; background: #b7f397; color: #10110f;
      font: inherit; font-weight: 700; cursor: pointer;
    }
    .error { color: #ffb5a8; }
    .back { display: inline-block; margin-top: 28px; }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/">saffron<span style="color:#b7f397">.</span></a>
    <h1>Welcome back.</h1>
    <p>Sign in to access your runs and execution history.</p>

    {% if form.errors %}
      <p class="error">Sign-in failed. Check your username and password.</p>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <label for="id_username">Username</label>
      <input id="id_username" name="username" autocomplete="username"
             required autofocus>
      <label for="id_password">Password</label>
      <input id="id_password" name="password" type="password"
             autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
    <a class="back" href="/">← Back to Saffron</a>
  </main>
</body>
</html>
